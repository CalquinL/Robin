server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker (siempre 127.0.0.11). Con esto nginx resuelve el
    # nombre "backend" en cada petición en vez de una sola vez al arrancar:
    # así no falla si el contenedor del backend todavía no está listo, y si
    # se recrea con otra IP, nginx la vuelve a resolver sola.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:3900;

    # SPA: si la ruta no es un archivo real (ej. /publications/123 al recargar),
    # se devuelve index.html y React Router decide qué mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reemplaza al proxy de Vite (server.proxy en vite.config.ts) que solo
    # existe en desarrollo. VITE_API_URL del frontend es "/api/v1" (ruta
    # relativa), así que algo en este mismo origen tiene que reenviar esas
    # peticiones al contenedor del backend.
    # $request_uri conserva la ruta completa tal como llegó (/api/v1/...):
    # con un proxy_pass por variable, nginx NO hace el reemplazo automático
    # de la ruta que sí hace con un destino fijo, así que hay que armarla a mano.
    location /api/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imágenes de publicaciones, servidas por el backend (express.static).
    location /uploads/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
    }
}
